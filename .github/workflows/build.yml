name: Build and database checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: suhooltech_test
          POSTGRES_USER: suhooltech_test
          POSTGRES_PASSWORD: test_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U suhooltech_test -d suhooltech_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://suhooltech_test:test_only_password@localhost:5432/suhooltech_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install frontend dependencies
        run: npm install
      - name: Build frontend
        run: npm run build
      - name: Install API dependencies
        run: npm install --prefix server
      - name: Check API JavaScript syntax
        run: node --check server/src/index.js
      - name: Apply PostgreSQL migrations twice
        run: |
          cd server
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          import pg from "pg";

          const client = new pg.Client({ connectionString: process.env.DATABASE_URL });
          const migrations = [
            "001_core.sql",
            "002_projects_dashboard.sql",
            "003_quotes.sql",
            "004_hr.sql",
            "005_documents.sql",
            "006_admin_services.sql",
            "007_calendar.sql",
            "008_vault.sql",
            "009_inventory.sql",
            "010_finance.sql",
            "011_zatca.sql",
            "012_enterprise_modules.sql",
            "013_goods_receipts.sql",
            "014_supplier_invoices.sql",
            "015_sales_workflow.sql",
            "016_customer_receipts.sql",
            "017_sales_credit_notes.sql",
            "018_sales_cost_accounting.sql",
            "019_customer_credit_refunds.sql",
            "020_supplier_payments.sql",
            "021_zatca_connection_settings.sql",
            "022_payroll_accounting.sql",
          ];

          try {
            await client.connect();
            for (let pass = 1; pass <= 2; pass += 1) {
              for (const migration of migrations) {
                const sql = await readFile(`../database/init/${migration}`, "utf8");
                await client.query(sql);
                console.log(`Pass ${pass}: ${migration} OK`);
              }
            }
            const tables = await client.query(
              "select count(*)::int as count from information_schema.tables where table_schema = 'public' and table_type = 'BASE TABLE'"
            );
            console.log(`PostgreSQL migration check complete; public tables: ${tables.rows[0].count}`);
          } finally {
            await client.end();
          }
          NODE

      - name: Verify Windows migration runner matches SQL files
        run: |
          node --input-type=module <<'NODE'
          import { readFile, readdir } from "node:fs/promises";
          const runner = await readFile("scripts/apply-migrations.ps1", "utf8");
          const declared = [...runner.matchAll(/"(\\d{3}_[^"]+\\.sql)"/g)].map((match) => match[1]);
          const actual = (await readdir("database/init")).filter((name) => /^\\d{3}_.+\\.sql$/.test(name)).sort();
          if (JSON.stringify(declared) !== JSON.stringify(actual)) {
            console.error({ declared, actual });
            process.exit(1);
          }
          console.log(`Windows migration runner matches all ${actual.length} SQL migrations.`);
          NODE

      - name: Run PostgreSQL-backed API smoke tests
        run: node scripts/smoke-api.mjs

      - name: Assemble W500 release package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -e
          mkdir -p release/web release/api/src release/database/init release/hosting
          cp -R dist/. release/web/
          cp web.config release/web/web.config
          cp server/src/index.js release/api/src/index.js
          cp server/package.json release/api/package.json
          (cd release/api && npm install --omit=dev)
          cp database/init/*.sql release/database/init/
          mkdir -p release/scripts
          cp scripts/apply-migrations.ps1 scripts/backup-postgres.ps1 scripts/restore-postgres.ps1 release/scripts/
          cp hosting/mywindowshosting-w500/README.md release/hosting/README.md
          cp README.md release/README.md
          printf 'Commit: %s\nBuilt: %s\n' "$GITHUB_SHA" "$(date -u +%FT%TZ)" > release/BUILD-INFO.txt
          cd release
          zip -qr ../suhooltech-w500-release.zip .
      - name: Upload W500 release package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: suhooltech-w500-release-${{ github.sha }}
          path: suhooltech-w500-release.zip
          if-no-files-found: error
          retention-days: 30
